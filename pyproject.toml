[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circular_interpolation"
version = "0.1.0"
description = "Algorithms for circular angle interpolation."
authors = [
    {name = "Author"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "mypy"
]
